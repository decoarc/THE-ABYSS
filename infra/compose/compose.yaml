services:
  db:
    image: postgres:17-alpine
    environment:
      - POSTGRES_PASSWORD=postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - db_data:/var/lib/postgresql/data

  api:
    build:
      context: ../../apps/api
      dockerfile: Dockerfile.dev
    # MIX_ENV is deliberately unset: dev is the mix default, and an explicit
    # MIX_ENV=dev would also force `mix test` into dev (no test/support compiled).
    # Cria e migra o banco de dev antes de subir o servidor (idempotente).
    command: sh -c "mix ecto.create && mix ecto.migrate && mix phx.server"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=ecto://postgres:postgres@db/abyss_dev
      # Padrão 150 (faixa 5-400); ABYSS_TEST_SPECIES=false liga o mundo vazio.
      - ABYSS_POPULATION=${ABYSS_POPULATION:-150}
      - ABYSS_TEST_SPECIES=${ABYSS_TEST_SPECIES:-true}
      # Semente fixa opcional (mundo repetível); vazia = aleatória.
      - ABYSS_SEED=${ABYSS_SEED:-}
      # Só para medição: multiplica a comida (vazia = 1.0, a canônica).
      - ABYSS_FOOD_BOOST=${ABYSS_FOOD_BOOST:-}
    ports:
      - "4000:4000"
    volumes:
      - ../../apps/api:/app
      - ../../shared:/shared:ro
      - api_deps:/app/deps
      - api_build:/app/_build

volumes:
  db_data:
  api_deps:
  api_build:
